# Alembic 配置（从 backend/ 目录执行：alembic upgrade head）
[alembic]
script_location = alembic
prepend_sys_path = .
# 实际连接串由 alembic/env.py 从应用配置（.env / 环境变量）读取
sqlalchemy.url = sqlite:///./zd_shixun.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
