# Alembic config. NOTE: keep this file ASCII-only -- alembic reads it with
# locale encoding, so non-ASCII comments break `alembic upgrade` on GBK
# locales (e.g. Windows zh-CN). Run from backend/: alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# Real connection string is resolved by alembic/env.py from app config
# (.env / environment variables), not from this placeholder.
sqlalchemy.url = sqlite:///./zd_shixun.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
