[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhidao-contracts"
version = "0.1.0"
description = "智导实训 V2 跨端统一数据契约（server / web / desktop 共享，独立于 server 实现）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
